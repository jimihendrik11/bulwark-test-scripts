name: Test Drive request

on:
  repository_dispatch:
    types: [test-drive]
  workflow_dispatch:
    inputs:
      address:
        description: ERC-20 address to test on Robinhood Chain
        required: true
        default: "0x39dBED3a2bd333467115dE45665cC57F813C4571"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Test Drive
        env:
          RPC_URL: ${{ secrets.ALCHEMY_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
          BLOCK_NUMBER: "0"
        run: |
          chmod +x test-drive.sh
          ./test-drive.sh ${{ github.event.client_payload.address || github.event.inputs.address }}
      - name: Publish the result file
        run: |
          node script/test-drive-manifest.mjs
          git config user.name "bulwark-test-drive"
          git config user.email "test-drive@bulwarkproof.tech"
          git add results/TD-*.json results/manifest.json
          git diff --cached --quiet || git commit -m "Test Drive result for ${{ github.event.client_payload.address || github.event.inputs.address }}"
          git push
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: test-drive-result
          path: |
            results/TD-*.json
            test-drive/results/td-raw.json
