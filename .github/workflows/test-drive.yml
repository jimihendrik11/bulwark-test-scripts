name: Test Drive

on:
  workflow_dispatch:
    inputs:
      address:
        description: ERC-20 address to test on Robinhood Chain
        required: true
        default: "0x39dBED3a2bd333467115dE45665cC57F813C4571"
      block:
        description: Fork block, 0 uses the current head
        required: false
        default: "0"
  push:
    paths:
      - "test-drive/test/**"
      - "test-drive.sh"
      - "test-drive/foundry.toml"
      - "test-drive/thresholds.json"
      - "test-drive/signoff.json"
      - "script/test-drive-*.mjs"
      - ".github/workflows/test-drive.yml"

permissions:
  contents: write

jobs:
  test-drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run Test Drive
        env:
          RPC_URL: https://rpc.mainnet.chain.robinhood.com
          BLOCK_NUMBER: ${{ github.event.inputs.block || '0' }}
        run: |
          chmod +x test-drive.sh
          ./test-drive.sh ${{ github.event.inputs.address || '0x39dBED3a2bd333467115dE45665cC57F813C4571' }}
      - name: Publish the result file
        run: |
          node script/test-drive-manifest.mjs
          git config user.name "bulwark-test-drive"
          git config user.email "test-drive@bulwarkproof.tech"
          git add results/TD-*.json results/manifest.json
          git diff --cached --quiet || git commit -m "Test Drive result for ${{ github.event.inputs.address || '0x39dBED3a2bd333467115dE45665cC57F813C4571' }}"
          git push
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: test-drive-results
          path: |
            results/TD-*.json
            results/manifest.json
            test-drive/results/td-raw.json

